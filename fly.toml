# fly launch --no-deploy (then edit app name), fly secrets set ..., fly deploy
app = "roofmeasure-mcp"
primary_region = "dfw"

[build]

[env]
  PORT = "8080"
  ROOFMEASURE_OUT_DIR = "/data/reports"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"

[mounts]
  source = "reports"
  destination = "/data"
